# Production deployment. See DEPLOY.md.
#
#   docker compose --profile tunnel up -d --build    site + Cloudflare Tunnel
#   docker compose up -d --build                     site only, on 127.0.0.1:3000
#   docker compose run --rm scrape --from "Lexi Lore" --limit 30
#   docker compose run --rm backup
#
# Secrets come from .env (git- and docker-ignored). Each service is handed only
# the variable it needs, so the web app sees no secrets at all.

# Hardening shared by every container that runs our image.
x-hardened: &hardened
  image: family-tree:latest
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=16m"]
  volumes:
    - data:/data # the SQLite database lives here and survives rebuilds/restarts

x-logs: &logs
  driver: local
  options: { max-size: "10m", max-file: "3" }

services:
  app:
    <<: *hardened
    build: .
    restart: unless-stopped
    # Next writes its fetch/render cache here; keep it in memory.
    tmpfs: ["/tmp:size=16m", "/app/.next/cache:size=64m,uid=1000,gid=1000"]
    # Loopback only, for SSH tunnels and debugging. Public traffic arrives via
    # cloudflared over the compose network, so no port is opened to the world.
    ports: ["127.0.0.1:${PORT:-3000}:3000"]
    mem_limit: 512m
    pids_limit: 200
    logging: *logs

  # Outbound-only connection to Cloudflare: no inbound ports, origin IP hidden.
  # In the Cloudflare dashboard, point the tunnel's public hostname at
  # http://app:3000.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    depends_on: [app]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    logging: *logs

  # One-off jobs.
  scrape:
    <<: *hardened
    profiles: [tools]
    environment:
      STASHDB_API_KEY: ${STASHDB_API_KEY:-}
      STASHDB_TAG_IDS: ${STASHDB_TAG_IDS:-}
      STASHDB_MIN_INTERVAL_MS: ${STASHDB_MIN_INTERVAL_MS:-1000}
    entrypoint: ["node", "dist/scrape.mjs"]
    mem_limit: 512m
    logging: *logs

  backup:
    <<: *hardened
    profiles: [tools]
    entrypoint: ["node", "dist/backup.mjs"]
    logging: *logs

volumes:
  data:
